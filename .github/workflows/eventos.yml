name: Atualizar agenda Ticket Sports
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenda-ticketsports
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci --include=dev
      - name: Instalar navegador do robô
        id: browser
        run: npx playwright install --with-deps chromium
      - name: Buscar eventos e atualizar o banco
        env:
          EVENT_SYNC_TOKEN: ${{ secrets.EVENT_SYNC_TOKEN }}
        run: node --import tsx scripts/ticketsports-browser.mjs
      - name: Avisar falha de instalação
        if: failure() && steps.browser.outcome == 'failure'
        env:
          EVENT_SYNC_TOKEN: ${{ secrets.EVENT_SYNC_TOKEN }}
        run: node --import tsx scripts/ticketsports-browser.mjs --report-install-failure
      - name: Guardar resultado do robô
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-robo
          path: robot-result/status.json
          if-no-files-found: ignore
          retention-days: 7
